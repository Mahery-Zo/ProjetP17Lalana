mutation AddComment($content: String!, $reportId: UUID!) @auth(level: USER) {
  comment_insert(data: { content: $content, reportId: $reportId, userId_expr: "auth.uid", createdAt_expr: "request.time" })
}

query ListPublicReports @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  reports(where: { isPublic: { eq: true } }) {
    id
    title
    description
    location
    imageUrl
    createdAt
    category {
      id
      name
    }
    user {
      id
      displayName
      photoUrl
    }
  }
}

mutation UpdateReportStatus($reportId: UUID!, $newStatus: String!) @auth(level: USER) {
  statusChange_insert(data: { reportId: $reportId, userId_expr: "auth.uid", newStatus: $newStatus, oldStatus: "pending", createdAt_expr: "request.time" })
  report_update(id: $reportId, data: { status: $newStatus }) {
    id
  }
}

query GetMyReports @auth(level: USER) {
  reports(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    title
    description
    location
    imageUrl
    createdAt
    category {
      id
      name
    }
    status
    isPublic
  }
}